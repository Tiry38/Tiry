<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: forge:; frame-src forge:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiry App Forge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="o1"></i><i class="o2"></i><i class="o3"></i><i class="o4"></i></div>

<header class="titlebar">
  <div class="brand"><img src="../assets/icon.png" alt="" class="brand-mark"><span class="wordmark">Tiry App Forge</span></div>
  <div class="pills" id="status-pills"></div>
</header>

<nav class="sidebar" id="nav" aria-label="Hauptnavigation">
  <button class="nav-item on" data-view="studio" title="Studio"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7z"/></svg><span>Studio</span></button>
  <button class="nav-item" data-view="autopilot" title="Autopilot"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 7v5l3 3"/><path d="M19 2v5h-5"/></svg><span>Autopilot</span></button>
  <button class="nav-item" data-view="trends" title="Trend-Radar"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg><span>Trends</span></button>
  <button class="nav-item" data-view="network" title="Netzwerk"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="5" r="2"/><circle cx="20" cy="5" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/></svg><span>Netzwerk</span></button>
  <button class="nav-item" data-view="cloud" title="Cloud & Fernsteuerung"><svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z"/></svg><span>Cloud</span></button>
  <button class="nav-item" data-view="lessons" title="Lernspeicher"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg><span>Lernen</span></button>
  <button class="nav-item" data-view="settings" title="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Einstellungen</span></button>
</nav>

<main class="stage">
  <section class="view on" id="view-studio"></section>
  <section class="view" id="view-autopilot"></section>
  <section class="view" id="view-trends"></section>
  <section class="view" id="view-network"></section>
  <section class="view" id="view-cloud"></section>
  <section class="view" id="view-lessons"></section>
  <section class="view" id="view-settings"></section>
</main>

<div class="detail-bg" id="detail-bg"></div>
<aside class="detail" id="detail" aria-modal="true" role="dialog"></aside>
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="dev-mock.js"></script>
<script src="app.js"></script>
</body>
</html>
