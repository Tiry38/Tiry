name: Luna (Android-App) bauen & ausliefern

# Jede Änderung an luna-app/ baut eine neue APK und legt sie als GitHub-Release „luna-v1.0.<Lauf>“ ab.
# Wichtig: Das Release wird NICHT als „latest“ markiert – das gehört dem Windows-Programm (Auto-Update).
on:
  push:
    paths: ['luna-app/**', '.github/workflows/luna-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luna-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: luna-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Offline-Sprachmodell (Vosk, Deutsch) holen
        run: |
          curl -fsSL -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-de-0.15.zip
          unzip -q /tmp/model.zip -d /tmp/model
          rm -rf app/src/main/assets/model-de
          mv /tmp/model/vosk-model-small-de-0.15 app/src/main/assets/model-de
          test -f app/src/main/assets/model-de/am/final.mdl
      - name: Eigenen Signatur-Schlüssel nutzen (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.LUNA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/luna.jks"
            echo "LUNA_KEYSTORE_FILE=$RUNNER_TEMP/luna.jks" >> "$GITHUB_ENV"
          fi
      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: APK bauen
        env:
          LUNA_VERSION_CODE: ${{ github.run_number }}
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: |
          # leere Secrets nicht als Werte durchreichen
          [ -z "$LUNA_KEYSTORE_PASSWORD" ] && unset LUNA_KEYSTORE_PASSWORD
          [ -z "$LUNA_KEY_ALIAS" ] && unset LUNA_KEY_ALIAS
          [ -z "$LUNA_KEY_PASSWORD" ] && unset LUNA_KEY_PASSWORD
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Luna-1.0.${{ github.run_number }}.apk"
      - name: Release veröffentlichen (nicht als „latest“)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="1.0.${{ github.run_number }}"
          TAG="luna-v$VER"
          APK="$RUNNER_TEMP/Luna-$VER.apk"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --verify-tag --prerelease --latest=false \
              --title "Luna $VER (Android)" \
              --notes "Luna – deine Sprach-Assistentin. Auf dem Handy die .apk herunterladen und öffnen (Installation aus unbekannten Quellen erlauben). Anleitung: luna-app/README.md"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: luna-apk
          path: ${{ runner.temp }}/Luna-*.apk
