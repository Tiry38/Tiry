name: Tiry's Mails bauen

# Baut den Windows-Installer auf einem Windows-Rechner von GitHub.
# - Jeder Push mit Änderungen in email-aufraeumer/: Tests, Installer, Start-Test der .exe, Installer als Artefakt.
# - Danach (main und claude/-Zweige) feste Download-Adresse + Selbst-Update-Quelle:
#   https://github.com/Tiry38/Tiry/releases/download/tirys-mails-latest/Tirys-Mails-Setup.exe
on:
  push:
    branches: [main, 'claude/**']
    paths: ['email-aufraeumer/**', '.github/workflows/email-aufraeumer.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: email-aufraeumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: email-aufraeumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: email-aufraeumer/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Versionsnummer setzen (0.1.<Lauf>)
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Installer bauen
        run: npm run dist -- --publish never
      - name: Start-Test der .exe (Demo-Modus, 25 s)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked -Filter *.exe | Where-Object { $_.Name -like 'Tiry*' } | Select-Object -First 1
          if (-not $exe) { throw 'Programmdatei fehlt' }
          $p = Start-Process $exe.FullName -ArgumentList '--demo' -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { throw "Programm hat sich beendet (Code $($p.ExitCode))" }
          Write-Host "Läuft nach 25 s noch: $($exe.Name) (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force
          Get-Item dist/Tirys-Mails-Setup.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: email-aufraeumer-installer
          path: email-aufraeumer/dist/Tirys-Mails-Setup.exe
      - name: Update-Release tirys-mails-latest aktualisieren
        # Installierte Programme holen sich neue Versionen über latest.yml in diesem Release (electron-updater, generic)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="tirys-mails-latest"
          test -f dist/latest.yml || { echo "dist/latest.yml fehlt"; exit 1; }
          FILES=(dist/Tirys-Mails-Setup.exe dist/Tirys-Mails-Setup.exe.blockmap dist/latest.yml)
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "Tiry's Mails 0.1.${{ github.run_number }}" --latest=false
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --latest=false \
              --title "Tiry's Mails 0.1.${{ github.run_number }}" \
              --notes "Tiry's Mails – Mailprogramm mit Aufräumer. Installiert sich einmal, danach aktualisiert es sich selbst."
          fi
