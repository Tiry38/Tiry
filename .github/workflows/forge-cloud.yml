name: Forge Cloud Autopilot

# Läuft ohne deinen PC.
# - GRATIS-MODUS (kein ANTHROPIC_API_KEY): veröffentlicht Galerie + Fernsteuerung, arbeitet Fernbefehle ab.
#   Neue KI-Apps baut die nächtliche Claude-Code-Sitzung über dein Claude-Abo (siehe app-forge/docs/GRATIS-MODUS.md).
# - API-MODUS (Secret ANTHROPIC_API_KEY gesetzt): erschafft und verbessert Apps selbst (kostet API-Guthaben).
# Die Bibliothek liegt im Branch "forge-library". Zeitpläne laufen nur auf dem Standard-Branch.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Aufgabe'
        type: choice
        options: [autopilot, create, evolve, trends, commands, publish]
        default: autopilot
      count:
        description: 'Anzahl Schritte / Apps (1–10)'
        type: number
        default: 2

permissions:
  contents: write

concurrency:
  group: forge-cloud
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_AI: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
      FORGE_DATA_DIR: ${{ github.workspace }}/forge-data
    steps:
      - name: Lohnt sich der Lauf?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HAS_AI" = "true" ] || [ "$HAS_FIREBASE" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Gratis-Modus ohne Firebase: nichts zu veröffentlichen – Lauf übersprungen (spart Minuten)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-forge/package-lock.json

      - name: Abhängigkeiten + Test-Labor
        if: steps.gate.outputs.go == 'true'
        working-directory: app-forge
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: App-Bibliothek laden (Branch forge-library)
        if: steps.gate.outputs.go == 'true'
        run: |
          git config --global user.name "forge-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash app-forge/scripts/library-sync.sh pull

      - name: Forge ausführen
        if: steps.gate.outputs.go == 'true'
        working-directory: app-forge
        env:
          # Ohne API-Key: Gratis-Modus → nur veröffentlichen (keine Kosten). Manuell gewählte Modi laufen offline.
          FORGE_MODE: ${{ inputs.mode || (env.HAS_AI == 'true' && 'autopilot' || 'publish') }}
          FORGE_COUNT: ${{ inputs.count || 2 }}
          FORGE_SITE_DIR: ${{ github.workspace }}/app-forge/cloud/site
          FORGE_MODEL: ${{ vars.FORGE_MODEL }}
          FORGE_DAILY_USD: ${{ vars.FORGE_DAILY_USD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: node scripts/cloud-run.js

      - name: Bibliothek sichern
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          bash app-forge/scripts/library-sync.sh push "Forge-Lauf ${{ inputs.mode || 'zeitplan' }} $(date -u +%Y-%m-%d_%H%M)"

      - name: Galerie + Fernsteuerung auf Firebase Hosting
        if: env.HAS_FIREBASE == 'true' && steps.gate.outputs.go == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
          entryPoint: ./app-forge/cloud
