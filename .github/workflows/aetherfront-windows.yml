name: Aetherfront – Windows-Spiel bauen

# Baut den Windows-Installer von Aetherfront. Auf main zusätzlich als GitHub-Release veröffentlicht.
on:
  push:
    paths: ['aetherfront/**', '.github/workflows/aetherfront-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aetherfront-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aetherfront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aetherfront/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Versionsnummer setzen (0.1.<Lauf>)
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Spiel bündeln & Installer bauen
        run: |
          node scripts/build.mjs
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Aetherfront-Windows-Installer
          path: aetherfront/dist/*.exe
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Aetherfront-ohne-Installer
          path: aetherfront/dist/win-unpacked/

      - name: Startprobe – fertiges Spiel mit frischem Profil starten (wie auf einem neuen PC)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "startprobe"
          New-Item -ItemType Directory -Force $out | Out-Null
          Remove-Item -Recurse -Force (Join-Path $env:APPDATA "Aetherfront") -ErrorAction SilentlyContinue
          $env:AETHER_SMOKE_OUT = $out
          $env:AETHER_SMOKE_DELAY = "20000"
          $p = Start-Process -FilePath "dist\win-unpacked\Aetherfront.exe" -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Error "Spiel hat sich nicht beendet" }
          Get-Content (Join-Path $env:APPDATA "Aetherfront\start.log") -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $out "electron-smoke.png"))) { Write-Error "Kein Startbild – das Spiel startet auf Windows nicht"; exit 1 }
          Write-Host "Startprobe ok"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Startprobe-Bild
          path: ${{ runner.temp }}/startprobe/
      - name: Release veröffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="0.1.${{ github.run_number }}"
          TAG="aetherfront-v$VER"
          git tag "$TAG" "$GITHUB_SHA" && git push origin "refs/tags/$TAG"
          gh release create "$TAG" dist/*.exe dist/*.zip --verify-tag --title "Aetherfront $VER" \
            --notes "Windows-Installer von Aetherfront. Herunterladen, ausführen, spielen."
