name: Windows-Programm bauen & ausliefern

# Jede Änderung auf dem Hauptzweig baut einen neuen Installer und veröffentlicht ihn als GitHub-Release.
# Das installierte Programm findet das Release automatisch (electron-updater) und aktualisiert sich selbst.
on:
  push:
    branches: [main, master]
    paths: ['app-forge/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-forge/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Versionsnummer setzen (1.0.<Lauf>)
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
      - name: Installer bauen
        run: npx electron-builder --win --x64 --publish never
      # Tag + Release selbst anlegen: GitHub lehnt veröffentlichte Releases ohne vorhandenen Tag ab (422).
      # latest.yml gehört dazu – daraus liest das installierte Programm (electron-updater) die neue Version.
      - name: Release veröffentlichen (Tag, Installer, Update-Infos)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="1.0.${{ github.run_number }}"
          TAG="v$VER"
          ls -la dist
          test -f dist/latest.yml || { echo "dist/latest.yml fehlt"; exit 1; }
          # Auto-Update lädt genau die Datei aus latest.yml – Name muss 1:1 passen (keine Leerzeichen).
          EXE=$(sed -n 's/^path: //p' dist/latest.yml | tr -d '\r')
          test -f "dist/$EXE" || { echo "latest.yml verweist auf fehlende Datei: $EXE"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG existiert bereits"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          FILES=(dist/*.exe dist/*.exe.blockmap dist/latest.yml)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" --verify-tag --latest \
              --title "Tiry App Forge $VER" \
              --notes "Automatischer Build von ${GITHUB_SHA::7}. Neu installieren: die .exe herunterladen und ausführen. Bereits installierte Programme aktualisieren sich selbst."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app-forge/dist/*.exe
