name: Luna-Auftrag Wachhund

# Sicherheitsnetz: Bleibt ein Luna-Auftrag liegen (GitHub hat einen wartenden Lauf verworfen, Ablauf abgebrochen …),
# startet ihn dieser Wachhund stündlich neu – aber nur, wenn gerade kein Auftrag läuft oder wartet.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liegengebliebene Aufträge anstoßen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          AKTIV=$(gh api "repos/$REPO/actions/workflows/luna-auftrag.yml/runs?per_page=30" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$AKTIV" -gt 0 ]; then echo "Es läuft/wartet schon ein Auftrag ($AKTIV) – nichts zu tun."; exit 0; fi
          NEXT=$(gh api "repos/$REPO/issues?labels=luna-auftrag&state=open&creator=Tiry38&sort=created&direction=asc&per_page=50" \
            --jq '[.[] | select((.created_at | fromdateiso8601) < (now - 600))][0].number // empty')
          if [ -z "$NEXT" ]; then echo "Keine liegengebliebenen Aufträge."; exit 0; fi
          # Schon ein gescheiterter Versuch (⏳-Kommentar)? Dann ist das der zweite und letzte.
          V=1
          if gh api "repos/$REPO/issues/$NEXT/comments" --jq '.[].body' | grep -q '^⏳'; then V=2; fi
          echo "Starte liegengebliebenen Auftrag #$NEXT (Versuch $V)."
          gh workflow run luna-auftrag.yml -R "$REPO" --ref main -f issue="$NEXT" -f versuch="$V"
