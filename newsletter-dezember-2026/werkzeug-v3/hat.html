<!doctype html><html><body style="margin:0;background:transparent"><canvas id="c" width="600" height="480"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let s=7;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};
// Koerper (Spitze haengt nach rechts unten)
const body=new Path2D('M90 330 C110 230 170 120 290 70 C370 38 450 48 500 95 C540 135 548 190 528 222 C512 246 486 240 482 214 C478 180 468 150 438 140 C380 122 330 200 318 330 Z');
g.save();g.clip(body);
let gr=g.createLinearGradient(80,60,520,340);gr.addColorStop(0,'#E5262F');gr.addColorStop(.45,'#C40F22');gr.addColorStop(1,'#7A0716');g.fillStyle=gr;g.fillRect(0,0,600,480);
// Licht/Falten
const fold=(x1,y1,x2,y2,w,a,col)=>{g.strokeStyle=col;g.globalAlpha=a;g.lineWidth=w;g.lineCap='round';g.filter='blur('+(w/2.2)+'px)';g.beginPath();g.moveTo(x1,y1);g.quadraticCurveTo((x1+x2)/2+20,(y1+y2)/2-30,x2,y2);g.stroke();g.filter='none';g.globalAlpha=1};
fold(150,320,320,95,46,.28,'#FF6A6A');fold(250,325,420,120,30,.35,'#5E0410');fold(330,300,470,150,22,.22,'#FF7A7A');fold(200,330,300,180,18,.3,'#640512');fold(440,150,510,210,26,.3,'#5A0410');
// Rundung: Licht von links oben, Schatten zur Unterseite der Spitze
let rg=g.createRadialGradient(200,170,20,240,220,320);rg.addColorStop(0,'rgba(255,140,140,.35)');rg.addColorStop(.45,'rgba(255,90,90,0)');rg.addColorStop(1,'rgba(40,0,8,.55)');g.fillStyle=rg;g.fillRect(0,0,600,480);
let ug=g.createRadialGradient(470,170,10,470,170,110);ug.addColorStop(0,'rgba(30,0,6,.5)');ug.addColorStop(1,'rgba(30,0,6,0)');g.fillStyle=ug;g.fillRect(0,0,600,480);
fold(120,325,260,150,60,.18,'#FF8080');fold(290,330,380,110,34,.4,'#4A020C');fold(360,120,490,110,20,.3,'#FF9A9A');
// Filz-Struktur
const im=g.getImageData(0,0,600,480),d=im.data;for(let i=0;i<d.length;i+=4){if(d[i+3]){const n=(R()-.5)*22;d[i]+=n;d[i+1]+=n*.4;d[i+2]+=n*.4}}g.putImageData(im,0,0);
// Schatten unter dem Rand
let sh=g.createLinearGradient(0,290,0,335);sh.addColorStop(0,'rgba(40,0,5,0)');sh.addColorStop(1,'rgba(40,0,5,.55)');g.fillStyle=sh;g.fillRect(0,280,600,60);
g.restore();
// Fell: Rand (Band) + Bommel aus Haerchen
function fur(cx,cy,shape,n,len){for(let i=0;i<n;i++){const [x,y,nx,ny]=shape();const l=len*(.5+R()*.8),a=Math.atan2(ny,nx)+(R()-.5)*1.4;
 const lum=205+R()*50,sh=Math.max(0,Math.min(1,(y-cy)/50+.45+(x-cx)/500));const v=Math.round(lum-sh*70);
 g.strokeStyle=`rgba(${v},${v-4},${v-10},${.35+R()*.5})`;g.lineWidth=.6+R()*1.3;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+(R()-.5)*4,y+Math.sin(a)*l*.5+(R()-.5)*4,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}}
// Rand: abgerundetes Band, leicht gebogen
const band=()=>{const t=R(),u=R();const x=70+t*290,yc=334-Math.sin(t*Math.PI)*14,y=yc+(u-.5)*44;return [x,y,(x-215)/120,(y-yc)/22+(R()-.5)]};
g.save();g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=10;g.shadowOffsetY=6;g.fillStyle='#EAE4DE';g.beginPath();g.moveTo(80,312);g.quadraticCurveTo(215,284,350,312);g.arcTo(372,334,350,358,24);g.quadraticCurveTo(215,334,80,358);g.arcTo(58,334,80,312,24);g.fill();g.restore();
fur(215,332,band,26000,9);
// Bommel
const pom=()=>{const a=R()*Math.PI*2,r=Math.sqrt(R())*30;const x=512+Math.cos(a)*r,y=236+Math.sin(a)*r;return [x,y,Math.cos(a),Math.sin(a)]};
g.save();g.shadowColor='rgba(0,0,0,.28)';g.shadowBlur=12;g.shadowOffsetY=6;g.fillStyle='#E8E2DC';g.beginPath();g.arc(512,236,32,0,7);g.fill();g.restore();
fur(512,236,pom,9000,11);
</script></body></html>
