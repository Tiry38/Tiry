<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;src:url(a/outfit-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Sora;src:url(a/sora-latin.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#17191E}
#st{position:relative;overflow:hidden}
.abs{position:absolute}
.big{font:900 150px/1 Outfit;letter-spacing:-.055em;white-space:nowrap}
.logo{filter:brightness(0) invert(1);opacity:.92}
</style></head><body>
<div id="st"></div>
<script>
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eur=n=>Math.round(n).toLocaleString('de-DE')+' €';
const S={};
/* Angebot im Studio: Ersparnis fuellt sich, Preis rollt von UVP auf Aktionspreis */
function offer(o){return {w:600,h:330,dur:2.0,render(t){
 const W=600,H=330;
 const r=eio((t-.15)/.95);                 // Zaehler
 const val=o.uvp-(o.uvp-o.preis)*r;
 const strike=ease((t-.1)/.4);
 const fill=eio((t-.55)/.9);
 const badge=t<1.05?0:Math.min(1,1+.25*Math.exp(-9*(t-1.05))*Math.sin(20*(t-1.05)));
 const bike=o.img?`<img class="abs" src="a/${o.img}" style="left:${o.bx??10}px;top:${o.by??78}px;width:${o.bw??360}px;filter:drop-shadow(0 18px 14px rgba(0,0,0,.55))">`
  :`<div class="abs" style="left:26px;top:92px;width:330px;height:200px;border:1.5px dashed rgba(242,212,176,.55);border-radius:8px"></div>
    <div class="abs" style="left:46px;top:150px;font:800 26px/1 Outfit;color:#F2D4B0;letter-spacing:.02em">[FOTO FOLGT]</div>
    <div class="abs" style="left:46px;top:188px;width:300px;font:500 13px/1.45 Sora;color:rgba(255,255,255,.75)">${o.ph}</div>`;
 $('#st').style.cssText=`width:${W}px;height:${H}px;background:
   radial-gradient(70% 55% at 32% 78%,rgba(255,255,255,.10),transparent 70%),
   linear-gradient(180deg,#1C1F25 0%,#15171B 100%)`;
 $('#st').innerHTML=`
 <div class="abs big" style="left:-10px;top:-8px;color:transparent;-webkit-text-stroke:1.3px rgba(242,212,176,.35)">−${eur(o.uvp-o.preis)}</div>
 <div class="abs big" style="left:-10px;top:-8px;color:#C8102E;opacity:.9;clip-path:inset(0 ${100-fill*100}% 0 0)">−${eur(o.uvp-o.preis)}</div>
 <div class="abs" style="left:0;right:0;top:276px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18) 20%,rgba(255,255,255,.18) 60%,transparent)"></div>
 ${bike}
 <img class="abs logo" src="a/${o.logo}" style="left:22px;top:${H-38}px;height:${o.lh||20}px">
 <div class="abs" style="right:24px;top:150px;text-align:right">
   <div style="position:relative;display:inline-block;font:600 15px/1 Sora;color:rgba(255,255,255,.62)">UVP ${eur(o.uvp)}
     <span style="position:absolute;left:-2px;top:7px;height:2px;width:${strike*104}%;background:#E2232D"></span></div>
   <div style="margin-top:10px;font:900 54px/1 Outfit;letter-spacing:-.035em;color:#fff;font-variant-numeric:tabular-nums">${eur(val)}</div>
   <div style="display:inline-block;margin-top:12px;padding:8px 12px;background:#C8102E;color:#fff;font:800 18px/1 Outfit;border-radius:4px;transform:scale(${badge});transform-origin:100% 50%">−${o.pct} % · Einzelstück</div>
 </div>`;
}}}
S.o1=offer({img:'rest-04.webp',logo:'marke-stevens.svg',uvp:4099,preis:2499,pct:39,lh:16});
S.o2=offer({img:null,ph:'Velo de Ville SEB890 SUV Smart 27,5″<br>Pure White · 45 cm · Trapez',logo:'marke-vdv.svg',uvp:3745,preis:2620,pct:30,lh:34});
S.o3=offer({img:'isy-03.webp',logo:'marke-isy.svg',uvp:4599,preis:3499,pct:24,bw:320,bx:30,by:70,lh:24});
S.o4=offer({img:'a-ktm-20663aa4df.webp',logo:'marke-ktm.svg',uvp:3799,preis:2799,pct:26,lh:22});
S.o5=offer({img:'isy-17.webp',logo:'marke-isy.svg',uvp:4999,preis:3999,pct:20,bw:320,bx:30,by:70,lh:24});
S.o6=offer({img:null,ph:'Velo de Ville AEB400 Allround 28″<br>wine red · 55 cm · Tiefeinsteiger',logo:'marke-vdv.svg',uvp:3199,preis:2239,pct:30,lh:34});
S.vr=offer({img:'a-van-raam-ecbad81d7a.webp',logo:'marke-vanraam.svg',uvp:8068,preis:6900,pct:14,bw:330,bx:16,by:62,lh:24});
window.SC=S;window.draw=(n,t)=>S[n].render(t);
</script></body></html>
