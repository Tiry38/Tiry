<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="640" height="960"></canvas>
<script>
const W=640,H=960,N=60; // 60 Bilder = 1 Schleife
let s=7;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};
const COLS=[['#B8291200','#B82912'],['#EB751F','#EB751F'],['#F7B32E','#F7B32E'],['#D4561A','#D4561A'],['#C9451A','#C9451A']];
const L=[];for(let i=0;i<34;i++){const z=R();L.push({x:R()*W,y0:R()*H,k:z<.5?1:(z<.85?1:2),sz:2.2+z*4.2,amp:12+R()*26,ph:R()*6.28,sp:R()*6.28,sw:1+Math.floor(R()*2),c:COLS[Math.floor(R()*COLS.length)],rot:R()*6.28,rs:(R()<.5?-1:1)})}
function leaf(g,sz,c){g.beginPath();g.ellipse(0,0,sz*.55,sz*1.35,0,0,6.283);g.fillStyle=c[1];g.fill();}
window.draw=f=>{const g=document.getElementById('c').getContext('2d');g.clearRect(0,0,W,H);const t=f/N;
 for(const l of L){const y=((l.y0+t*H*l.k)%H);
  for(const yy of [y,y-H]){const x=l.x+Math.sin(t*6.283*l.sw+l.ph)*l.amp;
   g.save();g.translate(x,yy);g.rotate(l.rot+t*6.283*l.rs);g.scale(Math.cos(t*6.283*l.sw+l.sp),1);leaf(g,l.sz,l.c);g.restore();}}};
</script></body></html>
