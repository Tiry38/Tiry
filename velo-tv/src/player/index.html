<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velo-TV</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="stylesheet" href="/player.css">
</head>
<body>
<div id="stage"></div>
<div id="idle" class="idle" hidden>
  <div class="idle-photo"></div>
  <div class="idle-rays"><i></i><i></i><i></i><i></i></div>
  <div class="idle-fog f1"></div><div class="idle-fog f2"></div>
  <canvas id="leaves" class="idle-leaves" aria-hidden="true"></canvas>
  <div class="idle-vignette"></div>
  <div class="idle-card">
    <span class="idle-shine"></span>
    <img src="/assets/logo.svg" alt="Velocenter Hessert" class="idle-logo">
    <span class="eyebrow"><i></i>Familienbetrieb seit 1995 · <b>Wörth am Rhein</b></span>
  </div>
  <div class="idle-time" id="idleTime"></div>
</div>
<div id="clock" class="clock" hidden></div>
<img id="cornerLogo" class="corner-logo" src="/assets/logo.svg" alt="" hidden>
<div id="hint" class="hint" hidden>OK auf der Fernbedienung drücken = Vollbild</div>
<div id="offline" class="offline-dot" hidden></div>
<script src="/shared/schedule.js"></script>
<script src="/idle.js"></script>
<script src="/player.js"></script>
</body>
</html>
